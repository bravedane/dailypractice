<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>Your Daily Practice</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  @font-face {
    font-family: 'Schabo Condensed';
    src: url('assets/SCHABO-Condensed.woff2') format('woff2');
    font-weight: 400;
    font-style: normal;
  }
  :root {
    --bg: #0c0c0c;
    --surface: #171717;
    --surface-2: #1d1d1d;
    --border: #2a2a2a;
    --gold: #ffd627;
    --text: #f7f7f7;
    --muted: #9a9a9a;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    background-image: radial-gradient(circle at 15% -10%, rgba(255, 214, 39, 0.07), transparent 45%);
    color: var(--text);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  .app {
    max-width: 600px;
    margin: 0 auto;
    height: 100vh;
    /* 100vh on mobile Safari includes the space behind the collapsing
       address bar, so the real visible viewport is shorter than this —
       dvh tracks the actual visible area and fixes it where supported. */
    height: 100dvh;
    display: flex;
    flex-direction: column;
  }
  .header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: calc(16px + env(safe-area-inset-top)) 16px 12px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .header img { height: 18px; opacity: 0.92; }
  .header .divider { width: 1px; height: 14px; background: var(--border); }
  .header .tagline {
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .bubble a { color: var(--gold); text-decoration: underline; }
  .row.user .bubble a { color: #171717; }
  .header-right {
    margin-left: auto;
    font-size: 11px;
    color: var(--muted);
    white-space: nowrap;
  }
  .progress-track {
    height: 3px;
    background: var(--border);
    flex-shrink: 0;
  }
  .progress-fill {
    height: 100%;
    background: var(--gold);
    transition: width 0.3s ease;
    width: 0%;
  }
  .scroll {
    flex: 1;
    overflow-y: auto;
    padding: 20px 16px 12px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  /* Push short conversations to the bottom with a margin on the first
     bubble rather than justify-content:flex-end on the scroll container.
     flex-end + overflow-y:auto is a known browser bug: once content is
     taller than the viewport, the overflowing top portion becomes
     unreachable by scrolling. margin-top:auto gets the same "stick to
     bottom when short" look without breaking scroll once content grows
     (e.g. the long results screen). */
  .scroll > *:first-child { margin-top: auto; }
  .row { display: flex; }
  .row.george { justify-content: flex-start; }
  .row.user { justify-content: flex-end; }
  .avatar {
    width: 26px; height: 26px;
    border-radius: 50%;
    background: var(--surface);
    border: 1px solid var(--gold);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    margin-right: 8px;
    margin-top: 2px;
  }
  .avatar img { width: 13px; height: auto; opacity: 0.95; }
  .bubble {
    max-width: 78%;
    padding: 11px 14px;
    border-radius: 14px;
    font-size: 14.5px;
    line-height: 1.5;
  }
  .bubble .hl { color: var(--gold); font-weight: 600; }
  .row.george .bubble {
    background: var(--surface);
    border: 1px solid var(--border);
    border-top-left-radius: 4px;
  }
  /* The live question — always the most recent George bubble — gets a gold
     border so it's visually distinct from everything already scrolled past.
     Applied by renderTranscript() marking only the last transcript item. */
  .row.george.live .bubble {
    border: 1.5px solid var(--gold);
    box-shadow: 0 0 0 1px rgba(255, 214, 39, 0.12);
  }
  .row.user .bubble {
    background: var(--gold);
    color: #171717;
    font-weight: 500;
    border-top-right-radius: 4px;
  }
  .typing-dots {
    display: flex;
    gap: 4px;
    padding: 4px 2px;
  }
  .typing-dots span {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--muted);
    animation: bounce 1.2s infinite;
  }
  .typing-dots span:nth-child(2) { animation-delay: 0.15s; }
  .typing-dots span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
    30% { transform: translateY(-4px); opacity: 1; }
  }
  /* .card is only ever the currently-active input (non-negotiables,
     practice, timing, reset) — never past/answered content — so a gold
     border here is always "the thing at hand", never a stale highlight. */
  .card {
    background: var(--surface-2);
    border: 1.5px solid var(--gold);
    border-radius: 12px;
    padding: 14px;
  }
  .card + .card { margin-top: 8px; }
  .input-area {
    border-top: 1px solid var(--border);
    padding: 14px 16px calc(16px + env(safe-area-inset-bottom));
    flex-shrink: 0;
    background: var(--bg);
    box-shadow: 0 -8px 16px -8px rgba(0,0,0,0.4);
  }
  .chip-row {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .chip {
    background: rgba(255, 214, 39, 0.1);
    border: 1.5px solid var(--gold);
    color: var(--gold);
    border-radius: 20px;
    padding: 10px 18px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.12s, transform 0.08s;
  }
  .chip:hover { background: rgba(255, 214, 39, 0.22); }
  .chip:active { transform: scale(0.97); }
  .chip.sel {
    background: var(--gold);
    color: #171717;
    border-color: var(--gold);
    font-weight: 700;
  }
  .text-row {
    display: flex;
    gap: 8px;
  }
  .text-row input[type=text], .text-row input[type=time] {
    flex: 1;
    background: var(--surface);
    border: 1.5px solid var(--gold);
    border-radius: 22px;
    color: var(--text);
    padding: 11px 16px;
    /* 16px minimum stops iOS Safari from force-zooming the whole page on
       focus — that zoom/unzoom on every text question was the main cause
       of the reported mobile spacing glitches. */
    font-size: 16px;
  }
  .text-row input:focus { outline: none; border-color: var(--gold); }
  button.send {
    background: var(--gold);
    color: #171717;
    border: none;
    border-radius: 22px;
    padding: 13px 22px;
    min-height: 46px;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    cursor: pointer;
  }
  button.send:disabled { opacity: 0.35; cursor: not-allowed; }
  button.send.ghost {
    background: transparent;
    color: var(--muted);
    border: 1px solid var(--border);
  }
  .continue-row {
    display: flex;
    justify-content: flex-end;
    margin-top: 10px;
  }
  /* Continue is the primary action on every card screen — make it a full
     width, easy-to-reach target instead of a small pill in the corner. */
  .continue-row .send { width: 100%; }
  .back-link {
    background: none;
    border: none;
    color: var(--muted);
    font-size: 12.5px;
    cursor: pointer;
    padding: 0;
    margin-bottom: 10px;
    display: block;
  }
  .back-link:hover { color: var(--text); }
  .field-label {
    display: block;
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 5px;
  }
  .nn-row, .reset-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 7px 0;
    border-bottom: 1px solid var(--border);
  }
  .nn-row:last-child, .reset-row:last-child { border-bottom: none; }
  .card input[type=text] {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    padding: 8px 10px;
    /* 16px minimum — see .text-row input note above re: iOS zoom. */
    font-size: 16px;
    margin-bottom: 8px;
  }
  .nn-toggle { display: flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; flex-shrink: 0; }
  .nn-toggle button { background: transparent; border: none; color: var(--muted); font-size: 11px; padding: 6px 10px; cursor: pointer; }
  .nn-toggle button.sel-in { background: var(--gold); color: #171717; font-weight: 700; }
  .nn-toggle button.sel-out { background: #3a1f1f; color: #ff8080; font-weight: 700; }
  .remove-x { background: none; border: none; color: #6b6b6b; cursor: pointer; font-size: 15px; padding: 0 4px; flex-shrink: 0; }
  .add-row { display: flex; gap: 6px; margin-top: 4px; }
  .add-row input { margin-bottom: 0 !important; flex: 1; }
  .add-row button { background: transparent; border: 1px solid var(--border); color: var(--gold); border-radius: 8px; padding: 0 12px; font-size: 12px; font-weight: 700; cursor: pointer; }
  select.date-sel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    padding: 10px 6px;
    font-size: 16px;
  }
  .directive {
    background: rgba(255, 214, 39, 0.1);
    border: 1px solid var(--gold);
    border-radius: 10px;
    padding: 10px 13px;
    font-size: 13px;
    line-height: 1.5;
  }
  .result-block { margin-bottom: 10px; }
  .result-block.highlight {
    border: 1px solid var(--gold);
    background: rgba(255, 214, 39, 0.08);
    border-radius: 10px;
    padding: 10px 12px;
  }
  .result-label {
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--gold);
    margin-bottom: 4px;
  }
  .result-value { font-size: 14px; line-height: 1.4; }
  .progress-hint {
    font-size: 11px;
    color: var(--muted);
    text-align: center;
    margin-bottom: 2px;
  }
  .result-actions {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-top: 6px;
  }
  button.pdf-btn {
    background: transparent;
    border: 1px solid var(--gold);
    color: var(--gold);
    border-radius: 22px;
    padding: 11px 18px;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    cursor: pointer;
  }
  button.pdf-btn:hover { background: rgba(255, 214, 39, 0.1); }
  .subscribe-box {
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px;
    margin-top: 4px;
  }
  .subscribe-box p {
    font-size: 13px;
    color: var(--muted);
    margin: 0 0 10px 0;
    line-height: 1.5;
  }
  .subscribe-row { display: flex; gap: 8px; }
  .subscribe-row input {
    flex: 1;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    color: var(--text);
    padding: 10px 14px;
    font-size: 13.5px;
  }
  .subscribe-row input:focus { outline: none; border-color: var(--gold); }
  .subscribe-status {
    font-size: 12px;
    color: var(--gold);
    margin-top: 8px;
  }
  @media print {
    @page { margin: 0.5in; }
    body { background: #fdfaf3 !important; background-image: none !important; color: #1a1a1a !important; }
    .header, .progress-track, .scroll, .input-area, .no-print { display: none !important; }
    .app { height: auto !important; max-width: none !important; }
    #printArea { display: block !important; }
  }
  #printArea { display: none; }
  #printArea {
    --ink: #1a1a1a;
    --ink-muted: #6b5f4a;
    --paper: #fdfaf3;
    --line: #d8cdb3;
    --accent: #a8860c;
    font-family: 'Inter', sans-serif;
    color: var(--ink);
    max-width: 680px;
    margin: 0 auto;
  }
  .doc-header {
    text-align: center;
    border-bottom: 3px double var(--accent);
    padding-bottom: 16px;
    margin-bottom: 22px;
  }
  .doc-eyebrow {
    font-size: 11px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 6px;
  }
  .doc-title {
    font-family: 'Schabo Condensed', sans-serif;
    font-size: 34px;
    text-transform: uppercase;
    letter-spacing: 0.02em;
    margin: 0;
  }
  .doc-sub {
    font-size: 12px;
    color: var(--ink-muted);
    margin-top: 6px;
  }
  .doc-section {
    margin-bottom: 20px;
    break-inside: avoid;
  }
  .doc-section-title {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    color: var(--accent);
    border-bottom: 1px solid var(--line);
    padding-bottom: 4px;
    margin-bottom: 10px;
  }
  .doc-habit-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding: 6px 0;
    border-bottom: 1px dotted var(--line);
    font-size: 13.5px;
    gap: 12px;
  }
  .doc-habit-row:last-child { border-bottom: none; }
  .doc-habit-name { font-weight: 600; flex-shrink: 0; }
  .doc-habit-detail { color: var(--ink-muted); font-size: 12.5px; text-align: right; }
  .doc-nn-list { list-style: none; padding: 0; margin: 0; columns: 2; column-gap: 24px; }
  .doc-nn-list li { font-size: 13px; padding: 4px 0; break-inside: avoid; }
  .doc-tracker {
    border-collapse: collapse;
    width: 100%;
    font-size: 9.5px;
    margin-top: 6px;
  }
  .doc-tracker {
    font-size: 7px;
  }
  .doc-tracker th, .doc-tracker td {
    border: 1px solid var(--line);
    text-align: center;
    padding: 1px 0;
  }
  .doc-tracker th.week-label, .doc-tracker td.habit-label {
    text-align: left;
    padding-left: 4px;
    font-size: 8px;
    font-weight: 600;
    white-space: nowrap;
  }
  .doc-tracker td.check-cell { width: 12px; height: 12px; }
  /* Trackers now live together on a single page (see .doc-tracker-wrap) so
     only the wrap itself forces a new page — individual month blocks stack
     within it instead of each claiming its own page. break-inside:avoid
     keeps a month's header + table together if it lands near a page edge. */
  .doc-tracker-wrap { break-before: page; padding-top: 4px; }
  .doc-tracker-month { break-inside: avoid; margin-bottom: 10px; }
  .doc-tracker-month:last-child { margin-bottom: 0; }
  .doc-month-line {
    display: flex;
    gap: 24px;
    margin-bottom: 14px;
    font-size: 13px;
  }
  .doc-month-line .fill {
    display: inline-block;
    min-width: 140px;
    border-bottom: 1px solid var(--ink);
    margin-left: 6px;
  }
  .doc-footer {
    margin-top: 24px;
    padding-top: 12px;
    border-top: 1px solid var(--line);
    text-align: center;
    font-size: 10.5px;
    color: var(--ink-muted);
    letter-spacing: 0.05em;
  }
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <img src="assets/mwod-logo-white.svg" alt="MWOD">
    <div class="divider"></div>
    <div class="tagline">Your Daily Practice</div>
    <div class="header-right" id="progressLabel">Progress</div>
  </div>
  <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
  <div class="scroll" id="scroll"></div>
  <div class="input-area" id="inputArea"></div>
  <div id="printArea"></div>
</div>

<script>
const CORE_AREAS = ["Fitness","Food","Sleep","Hydration","Family","Friends","Faith","Work","Frenemies","Money","Projects","Relationships","Phone"];
const RATING_LABELS = {
  "Fitness": ["Absent","Inconsistent","Strong"],
  "Food": ["Careless","Inconsistent","Clean"],
  "Sleep": ["Wrecked","Inconsistent","Rested"],
  "Hydration": ["Neglected","Inconsistent","Dialed In"],
  "Family": ["Distant","Inconsistent","Present"],
  "Friends": ["Isolated","Inconsistent","Connected"],
  "Faith": ["Dormant","Inconsistent","Grounded"],
  "Work": ["Behind","Treading Water","On Top Of It"],
  "Frenemies": ["Overexposed","Managing","Protected"],
  "Money": ["Avoiding It","Inconsistent","Disciplined"],
  "Projects": ["Stalled","Inconsistent","Shipping Consistently"],
  "Relationships": ["Disconnected","Misaligned","Known and Loved"],
  "Phone": ["Out Of Control","Some Control","Disciplined"]
};
function ratingLabelsFor(key) { return RATING_LABELS[key] || ["Absent","Inconsistent","Strong"]; }
const AREA_CLARIFIERS = {
  "Family": "however you define it — parents, spouse, kids, siblings, whoever counts",
  "Faith": "religious practice, spiritual life, alignment with your conscience, or whatever you personally ground yourself in",
  "Relationships": "romantic partner, if that's separate from Family for you",
  "Frenemies": "people who complicate more than they add",
  "Projects": "personal projects, not your job — Work covers that"
};
function areaClarifier(key) { return AREA_CLARIFIERS[key] || null; }
const AREA_QUESTION_OVERRIDES = {
  "Phone": "Let's talk about your **Phone Use**"
};
function areaQuestionIntro(key) { return AREA_QUESTION_OVERRIDES[key] || `Let's talk about **${key}**`; }
// Correction, 2026-09-29 (Dane): the tiered "harder question for veterans"
// idea (#5) went through two rewrites and both were wrong for the same
// underlying reason, not just bad phrasing. Every version — whether it
// announced "you've done this before" or just implied it via "not the
// surface reason, the actual one" — presumed a veteran's honest answer
// would be shallow unless the tool pushed past it. That's patronizing
// regardless of wording, and it's not how MWOD talks to people: the model
// is honest self-assessment, not an AI deciding someone needs prodding
// into depth. Removed the tiered variants entirely — one prompt, same for
// everyone, no presumption either way. The one legitimately different
// thing a veteran actually has — real history with specific things
// they've tried before — is asked plainly and factually in
// askTriedBefore() later in the flow ("what have you already tried that
// didn't stick"), which was never part of this correction.
function areaFollowUpPrompt(key, rating, ratingLabel) {
  const label = ratingLabel.toLowerCase();
  return `You said ${key} has been **${label}**. Will you share a bit more about why that is? The more specific you are, the better this ends up serving you.`;
}
const DEFAULT_NN = [
  { text: "Sleep — 7+ hrs average per week", status: "in" },
  { text: "Hydration — 90+ oz of water every day", status: "in" },
  { text: "Nutrition — eat clean", status: "in" },
  { text: "Movement — 1+ hr workout, 6 days a week", status: "in" },
  { text: "Check-ins — check in with your community daily", status: "in" }
];
const state = {
  transcript: [],
  customAreas: [],
  fRatings: {},
  fHowSo: {},
  isMember: null,
  roundCount: "",
  returningAfterGap: false,
  gapPicks: [],
  practices: {},
  timing: {},
  customRemovals: [],
  removalPicks: [],
  removalWhy: {},
  dismissedFlags: {},
  triedBefore: {},
  nonNegotiables: DEFAULT_NN.map(x => ({...x})),
  resetItems: ["No alcohol", "No processed food", "No refined sugar"],
  resetDateStr: "",
  resumePoint: null,
  pending: null,
  qCount: 0,
  stepNum: 0,
  history: []
};

// --- Save / resume (autosave) ------------------------------------------
// localStorage only, no server round-trip. Persists the answer data plus a
// coarse "resume point" (phase + index) so a closed tab or a refresh
// doesn't wipe out everything typed so far. This is NOT pixel-perfect
// resume of every micro-step — pending.onSubmit closures can't survive a
// page reload, so short one-off questions (e.g. "want to track anything
// else?") just get re-asked if the tab closes mid-way, which is cheap.
// The two genuinely long stretches — rating all 13 areas, and building a
// practice+timing pair per gap pick — get real idx-level checkpoints so
// refreshing partway through those doesn't send someone back to question 1.
const SAVE_KEY = 'mwodDailyPracticeDraft.v1';
const PERSISTED_KEYS = ['customAreas','fRatings','fHowSo','isMember','roundCount','returningAfterGap','gapPicks','practices','timing','customRemovals','removalPicks','removalWhy','dismissedFlags','triedBefore','nonNegotiables','resetItems','resetDateStr','resumePoint'];
function autosave() {
  try {
    const data = {};
    PERSISTED_KEYS.forEach(k => { data[k] = state[k]; });
    localStorage.setItem(SAVE_KEY, JSON.stringify(data));
  } catch (e) { /* private browsing / quota — fail silent, autosave is best-effort */ }
}
function loadSavedDraft() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return null;
    const data = JSON.parse(raw);
    if (!data || typeof data !== 'object') return null;
    return data;
  } catch (e) { return null; }
}
function clearSavedDraft() {
  try { localStorage.removeItem(SAVE_KEY); } catch (e) {}
}
function setResumePoint(phase, idx) {
  state.resumePoint = { phase, idx: idx == null ? null : idx };
  autosave();
}
function resumeFlow() {
  const rp = state.resumePoint;
  if (!rp) { startFlow(); return; }
  switch (rp.phase) {
    case 'isMember': askIsMember(); return;
    case 'roundCount': askRoundCount(); return;
    case 'nonNegotiables': askNonNegotiables(); return;
    case 'area': askArea(rp.idx || 0); return;
    case 'addAnotherArea': askAddAnotherArea(); return;
    case 'removalsIntro': askRemovalsIntro(); return;
    case 'returningGap': askReturningGap(); return;
    case 'gapPicks': askGapPicks(); return;
    case 'practice': askPracticeForArea(rp.idx || 0); return;
    case 'timing': askTimingForArea(rp.idx || 0); return;
    case 'reset': askReset(); return;
    case 'resetDate': askResetDate(); return;
    default: startFlow(); return;
  }
}
function startWithResumeCheck() {
  const saved = loadSavedDraft();
  // Only offer resume if they got at least past the first question — an
  // empty/near-empty save isn't worth interrupting the intro message for.
  if (saved && saved.isMember !== null && saved.isMember !== undefined) {
    state.stepNum = 0;
    updateProgressBar();
    pushGeorge("Welcome back — want to pick up where you left off, or start fresh?", () => {
      askQuestion("", {
        type: 'chips',
        options: [{label: 'Resume', value: 'resume'}, {label: 'Start Fresh', value: 'fresh'}],
        onSubmit: (val) => {
          if (val === 'resume') {
            PERSISTED_KEYS.forEach(k => { if (k in saved) state[k] = saved[k]; });
            resumeFlow();
          } else {
            clearSavedDraft();
            restart();
          }
        }
      });
    });
  } else {
    startFlow();
  }
}

// --- Back navigation -------------------------------------------------
function snapshotState() {
  const { transcript, history, pending, ...rest } = state;
  return JSON.parse(JSON.stringify(rest));
}
function restoreSnapshot(snap) {
  Object.keys(snap).forEach(k => { state[k] = snap[k]; });
}
function recordHistoryStep(text, pending) {
  state.history.push({ text, pending, snapshot: snapshotState(), transcriptLen: state.transcript.length });
}
function backButtonHtml() {
  if (state.history.length < 2) return '';
  return `<button class="back-link" onclick="goBack()">← Back</button><br>`;
}
function goBack() {
  if (state.history.length < 2) return;
  state.history.pop();
  const prev = state.history.pop();
  restoreSnapshot(prev.snapshot);
  state.transcript = state.transcript.slice(0, prev.transcriptLen);
  renderTranscript();
  let pending = prev.pending;
  if (pending.type === 'multichips') pending = { ...pending, selected: [] };
  recordHistoryStep(prev.text, pending);
  document.getElementById('inputArea').innerHTML = '';
  pushGeorge(prev.text, () => {
    state.pending = pending;
    renderInputArea();
  });
}

// Rough total question count for the progress bar. Recomputed as choices
// (custom areas, ratings, gap picks) become known so it stays honest rather
// than just decorative.
function computeStepTotal() {
  const areaCount = allAreaKeys().length;
  // "Why" now fires inline per flagged area (absent/inconsistent), right
  // after that area's rating — not per gapPick like before the reorder.
  // Count actual flags where known; otherwise estimate half the areas rated
  // so far will flag, which keeps the bar roughly honest before ratings
  // are in without needing to guess every area's outcome up front.
  const ratedKeys = allAreaKeys().filter(k => state.fRatings[k]);
  const flaggedSoFar = ratedKeys.filter(k => state.fRatings[k] !== 'strong').length;
  const whyEstimate = ratedKeys.length ? Math.round(flaggedSoFar / ratedKeys.length * areaCount) : Math.round(areaCount / 2);
  const gapCount = state.gapPicks.length || 2; // estimate before chosen
  const resetSteps = state.isMember ? 2 : 0; // reset list + reset date, members only
  return 1                    // round count
       + areaCount            // one quick rating tap per area
       + whyEstimate          // why, inline for flagged areas
       + 1                    // add-another-area prompt
       + 1                    // non-negotiables
       + (state.isMember ? 1 : 0) // returning-after-gap, members only
       + 1                    // gap picks
       + gapCount              // one card per practice
       + gapCount              // one combined timing card per habit
       + resetSteps;
}
function updateProgressBar() {
  const total = computeStepTotal();
  const pct = Math.min(96, Math.round((state.stepNum / total) * 100));
  const fill = document.getElementById('progressFill');
  if (fill) fill.style.width = pct + '%';
}
let uidCounter = 0;

function allAreaKeys() { return [...CORE_AREAS, ...state.customAreas]; }
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function formatGeorgeText(text) {
  let out = escapeHtml(text);
  out = out.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  out = out.replace(/\*\*(.+?)\*\*/g, '<span class="hl">$1</span>');
  return out;
}

function scrollBottom() {
  const el = document.getElementById('scroll');
  el.scrollTop = el.scrollHeight;
  // Input controls (chips/cards) render after the transcript and can
  // change the layout height slightly after this frame — nudge again

  requestAnimationFrame(() => { el.scrollTop = el.scrollHeight; });
}

function renderTranscript() {
  const el = document.getElementById('scroll');
  const lastIdx = state.transcript.length - 1;
  el.innerHTML = state.transcript.map((t, i) => {
    // "Live" = the most recent George message, whether it's still typing or

    const liveClass = (i === lastIdx && t.who === 'george') ? ' live' : '';
    if (t.typing) {
      return `<div class="row george${liveClass}"><div class="avatar"><img src="assets/mwod-logo-white.svg" alt="MWOD"></div><div class="bubble"><div class="typing-dots"><span></span><span></span><span></span></div></div></div>`;

// --- Fail-safes (#8) ---------------------------------------------------
// Soft, dismissible nudges only — never a hard block. MWOD's whole model
// is honest self-assessment, not gatekeeping, so nothing here should trap
// someone who wants to just get through it. Reuses the same tenure tiers
// tenureNudge() already established for gap-pick sizing, so "too lofty"
// means the same thing in both places instead of two competing scales.
function tenureTier() {
  if (state.returningAfterGap === true) return 'new';
  const n = parseInt(state.roundCount, 10);
  if (isNaN(n)) return 'mid';
  if (n <= 1) return 'new';
  if (n <= 3) return 'early';
  return 'veteran';
}
function parseApproxMinutes(text) {
  const t = (text || '').toLowerCase();
  let m = t.match(/(\d+)\s*(?:-|to)\s*(\d+)\s*h(?:ou)?r/);
  if (m) return ((+m[1] + +m[2]) / 2) * 60;
  m = t.match(/(\d+(?:\.\d+)?)\s*\+?\s*h(?:ou)?r/);
  if (m) return (+m[1]) * 60;
  m = t.match(/(\d+)\s*(?:-|to)\s*(\d+)\s*min/);
  if (m) return (+m[1] + +m[2]) / 2;
  m = t.match(/(\d+)\s*\+?\s*min/);
  if (m) return +m[1];
  return null;
}
function isTooLofty(amountText) {
  const mins = parseApproxMinutes(amountText);
  if (mins == null) return false;
  const tier = tenureTier();
  if (tier === 'new' && mins >= 60) return true;
  if (tier === 'early' && mins >= 120) return true;
  return false;
}
function isVaguePractice(text) {
  const words = (text || '').trim().split(/\s+/).filter(Boolean);
  return words.length > 0 && words.length < 3;
}
function isVagueAmount(text) {
  return (text || '').trim().length > 0 && !/\d/.test(text);
}
function isVagueAnchorText(text) {
  const words = (text || '').trim().split(/\s+/).filter(Boolean);
  return words.length > 0 && words.length < 2;
}
function isVagueShortAnswer(text) {
  const words = (text || '').trim().split(/\s+/).filter(Boolean);
  return words.length > 0 && words.length < 3;
}
function practiceCardFlags(key) {

  if (isVaguePractice(p.practice)) flags.push("That's pretty open-ended — want to name the specific action?");
  if (p.amount.trim() && isVagueAmount(p.amount)) flags.push("No number or time attached to that yet — worth pinning down how long or how much.");
  else if (isTooLofty(p.amount)) flags.push("That's a big jump this early in — sure you want to start there, or scale it back for now?");
  return flags;
}
function timingCardFlags(key) {
  const t = state.timing[key];

  if (t.anchor && isVagueAnchorText(t.anchor)) flags.push("That anchor's pretty thin — tie it to something more specific and fixed in your day.");
  if (t.backupAnchor && isVagueAnchorText(t.backupAnchor)) flags.push("Same for the backup — give it something concrete to hook onto.");
  return flags;
}

// --- MWOD round math ---
// Every round begins on the first Monday of the first month of its quarter
// (Jan, Apr, Jul, Oct) — same rule every quarter, no exceptions for the
// cart-open or course-start date. 12 weeks, then a 13th week called
// "Week 0". The Final Anchor Challenge is the final Saturday of Week 12,
// i.e. 5 days after the Week 12 Monday.
function pad2(n) { return String(n).padStart(2, '0'); }
function formatISODate(d) { return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`; }
function firstMondayOfMonth(year, monthIndex) {
  const d = new Date(year, monthIndex, 1);
  const dow = d.getDay(); // 0=Sun .. 6=Sat
  const offset = (8 - dow) % 7; // dow=1 (Mon) -> 0
  d.setDate(d.getDate() + offset);
  return d;
}
function roundStartForQuarter(year, quarterIndex) { return firstMondayOfMonth(year, quarterIndex * 3); }
// Finds the round (start date) whose 13-week span contains refDate, or the
// nearest upcoming round if refDate falls in a gap between rounds.
function getCurrentRoundStart(refDate) {
  const candidates = [];
  for (let y = refDate.getFullYear() - 1; y <= refDate.getFullYear() + 1; y++) {
    for (let q = 0; q < 4; q++) candidates.push(roundStartForQuarter(y, q));
  }
  candidates.sort((a, b) => a - b);
  for (const c of candidates) {
    const end = new Date(c); end.setDate(end.getDate() + 90); // 13 weeks - 1 day
    if (refDate >= c && refDate <= end) return c;
  }
  return candidates.find(c => c > refDate) || candidates[candidates.length - 1];
}
// Builds the pickable week options for ALAF's 4-consecutive-week
// commitment. Bug found 2026-09-29: this used to stop at the current
// round's Week 0 boundary, so anyone picking near the tail of a round
// (e.g. sitting in Week 0 itself, with no weeks left in-round) saw only
// one option — not enough to start a 4-week span at all. Fixed by walking
// forward round-by-round (current round, then the next one, etc.) until
// there are enough remaining weeks-not-yet-ended to make every offered
// start date a viable 4-week run. A round boundary crossing is still
// labeled with its real week number (Week 1 of the next round), never
// hidden — the date range in the label is what matters, not which round
// it nominally belongs to.
function buildRoundWeekOptions(refDate, weeksNeeded = 4) {
  const results = [];
  let roundStart = getCurrentRoundStart(refDate);
  const seenRoundStarts = new Set();
  // Walk forward enough rounds to guarantee weeksNeeded-1 weeks exist after
  // any offered start, even if that start is the very last remaining week
  // of the last round we collect from.
  while (seenRoundStarts.size < 6) {
    const key = formatISODate(roundStart);
    if (seenRoundStarts.has(key)) break;
    seenRoundStarts.add(key);
    const weekNumbers = [...Array.from({length: 12}, (_, i) => i + 1), 0];
    weekNumbers.forEach(n => {
      const offsetWeeks = n === 0 ? 12 : n - 1;
      const start = new Date(roundStart); start.setDate(start.getDate() + offsetWeeks * 7);
      const end = new Date(start); end.setDate(end.getDate() + 6);
      results.push({ n, start, end });
    });
    const nextStart = new Date(roundStart); nextStart.setDate(nextStart.getDate() + 91); // 13 weeks later
    roundStart = getCurrentRoundStart(nextStart);
    // Stop once we've collected enough future weeks past today that every
    // not-yet-ended week has a full 4-week run available after it.
    const notEnded = results.filter(w => w.end >= refDate);
    if (notEnded.length >= weeksNeeded + 12) break; // generous buffer, cheap to compute
  }
  return results.filter(w => w.end >= refDate).map(w => {
    const label = `Week ${w.n} (${w.start.toLocaleDateString('en-US',{month:'short',day:'numeric'})}\u2013${w.end.toLocaleDateString('en-US',{month:'short',day:'numeric'})})`;
    return { label, value: formatISODate(w.start) };
  });
}
function addDays(dateStr, days) { const d = new Date(dateStr+"T00:00:00"); d.setDate(d.getDate()+days); return d; }
function formatDate(d) { return d.toLocaleDateString('en-US', { weekday:'long', month:'long', day:'numeric' }); }

function startFlow() {

function labelForRating(key, rating) {
  const [lo, mid, hi] = ratingLabelsFor(key);
  return rating === 'strong' ? hi : rating === 'inconsistent' ? mid : lo;
}
function askArea(idx) {
  const keys = allAreaKeys();
  if (idx >= keys.length) { askAddAnotherArea(); return; }
  setResumePoint('area', idx);
  const key = keys[idx];
  const [lo, mid, hi] = ratingLabelsFor(key);
  const clarifier = areaClarifier(key);
  const clarifierLine = clarifier ? ` (${clarifier})` : '';
  askQuestion(`${areaQuestionIntro(key)}${clarifierLine}. How's that actually been going for you lately?`, {
    type: 'chips',
    options: [{label: lo, value: 'absent'}, {label: mid, value: 'inconsistent'}, {label: hi, value: 'strong'}],
    onSubmit: (val, label) => {
      state.fRatings[key] = val;
      // Reflect before commit: if the area's rated as a problem spot, ask
      // why right here — not later, after they've already agreed to build
      // a specific habit around it. The later gapPicks step ("which of
      // these do you want to build a daily habit around") is the real
      // commitment moment, and it should be an informed choice, not the
      // first time they've said anything about why an area is where it is.
      if (val === 'absent' || val === 'inconsistent') { askAreaWhy(idx, key); }
      else { askArea(idx + 1); }
    }
  });
}
function askAreaWhy(idx, key) {
  const rating = state.fRatings[key];
  const ratingLabel = labelForRating(key, rating);
  askQuestion(areaFollowUpPrompt(key, rating, ratingLabel), {
    type: 'text-optional', placeholder: 'One sentence is plenty',
    onSubmit: (val) => {

      state.fHowSo[key] = hadContent ? val : '';
      askArea(idx + 1);

}
function askAddAnotherArea() {

// --- Anything to remove (subtraction goals: alcohol, substances, gambling,
// toxic relationships, etc.) — a separate question shape from the areas

// a boundary to declare. Kept optional and low-pressure. ---
const REMOVAL_SUGGESTIONS = ["Alcohol", "Drugs / Substances", "Gambling", "A Toxic Relationship", "Screen / Media Bingeing"];

    type: 'chips',

  askQuestion(`What's going on with **${item}**? The more specific you are, the better this ends up serving you.`, {

    type: 'chips',

function tenureNudge() {
  if (state.returningAfterGap === true) {
    return "You're coming back after time away — that resets the clock, regardless of how many times you've done this before. Lean toward 1–2. Rebuild the streak before you rebuild the list.";
  }
  const n = parseInt(state.roundCount, 10);
  if (isNaN(n)) return null;
  if (n <= 1) return "You're new to this. Lean toward picking just 1 — maybe 2. Consistency beats a long list right now.";
  if (n <= 3) return "You've done this a few times. 1–2 is still a solid move — no need to max it out to prove something.";

}
function askGapPicks() {

  const proceed = () => {
    const keys = allAreaKeys();

    const list = flagged.length ? flagged : keys.filter(k => state.fRatings[k]);

    }).join("")}
    ${state.removalPicks.length ? `<div class="result-block"><div class="result-label">Cutting Out / Reducing</div><div class="result-value" style="font-size:13px;">${state.removalPicks.map(item => `${escapeHtml(item)}${state.removalWhy[item] ? ' — ' + escapeHtml(state.removalWhy[item]) : ''}`).join('<br>')}</div></div>` : ''}
    ${state.isMember ? `<div class="result-block"><div class="result-label">Act Like a FUTURE — 4 Weeks</div><div class="result-value">${resetRangeText}</div><div class="result-value" style="margin-top:4px; font-size:12px; color:var(--muted);">${state.resetItems.filter(r=>r.trim()).map(escapeHtml).join(' · ')}</div></div>` : ''}
  `;

  // --- Print / PDF version: a wall-worthy one-page declaration + an
  // analog-style 28-day tracker grid (habits down the side, days across,
  // hand-checked box per day). Built separately from the chat-bubble html
  // above — different audience (paper, not screen), different design needs.
  const trackerHabits = [
    ...nnIn.map(nn => nn.text.split(' — ')[0]),
    ...state.gapPicks
  ];
  const dayNums = Array.from({length: 31}, (_, i) => i + 1);
  const trackerHeader = dayNums.map(d => `<th>${d}</th>`).join('');
  function buildTrackerRows() {
    return trackerHabits.map(h => `
      <tr>
        <td class="habit-label">${escapeHtml(h)}</td>
        ${dayNums.map(() => `<td class="check-cell"></td>`).join('')}
      </tr>
    `).join('');
  }
  // All three months live on one page now (Dane's call — spread across 3
  // pages was more paper than the tracker needed). Each month gets a
  // smaller table so all three fit without overflowing; break-inside:avoid
  // on .doc-tracker-month keeps a given month from splitting mid-table if
  // it lands near the page edge.
  const trackerPagesHtml = `
    <div class="doc-tracker-wrap">
      ${[1, 2, 3].map(pageNum => `
        <div class="doc-tracker-month">
          <div class="doc-section-title">Month ${pageNum} — Check Off Each Day, By Hand</div>
          <div class="doc-month-line">Month:<span class="fill"></span>Year:<span class="fill"></span></div>
          <table class="doc-tracker">
            <thead><tr><th class="week-label">Habit</th>${trackerHeader}</tr></thead>
            <tbody>${buildTrackerRows()}</tbody>
          </table>
        </div>
      `).join('')}
    </div>
  `;

  const nnPrintList = state.nonNegotiables.map(nn =>
    `<li>${nn.status === 'in' ? '☑' : '☐'} ${escapeHtml(nn.text)}</li>`
  ).join('');

  const practicePrintRows = state.gapPicks.map(k => {
    const p = state.practices[k] || {};
    const t = state.timing[k] || {};
    return `
      <div class="doc-habit-row">
        <div>
          <div class="doc-habit-name">${escapeHtml(k)}</div>
          <div style="font-size:12px; color:var(--ink-muted); margin-top:2px;">${escapeHtml(p.practice||'')}</div>
          <div style="font-size:11px; color:var(--ink-muted); margin-top:2px;">Done when: ${escapeHtml(p.doneDefinition||'')} — ${escapeHtml(p.amount||'')}</div>
        </div>
        <div class="doc-habit-detail">
          ${t.time || '—'}<br>${escapeHtml(t.anchor||'')}
          <div style="margin-top:4px; font-size:11px;">Backup: ${t.backupTime||'—'} · ${escapeHtml(t.backupAnchor||'')}</div>
        </div>
      </div>
    `;
  }).join('');

  // Same rule as the on-screen Look Back: this is the quick snapshot rating,
  // not the deep-dive note (which lives in the Practice section for picked
  // areas). Showing the note here too was the second copy of the Bug #1
  // duplicate-content report — the on-screen version got fixed first, this
  // print version had the identical issue and would have shown up in the
  // PDF even after that fix.
  const lookBackPrintRows = baselineKeys.map(k => {
    const rating = state.fRatings[k];
    const label = labelForRating(k, rating);
    return `<div class="doc-habit-row"><div class="doc-habit-name">${escapeHtml(k)}</div><div class="doc-habit-detail">${escapeHtml(label)}</div></div>`;
  }).join('');

  // Header (title/date), footer tagline, and any page-number chrome are
  // deliberately omitted per Dane's direction — they read as distracting
  // metadata on a document meant to feel like a clean, wall-worthy
  // declaration, not a printed report.
  document.getElementById('printArea').innerHTML = `
    <div class="doc-section">
      <div class="doc-section-title">Baseline Habits</div>
      <ul class="doc-nn-list">${nnPrintList}</ul>
    </div>

    <div class="doc-section">
      <div class="doc-section-title">Current Reality</div>
      ${lookBackPrintRows}
    </div>

    <div class="doc-section">
      <div class="doc-section-title">Custom Habits</div>
      ${practicePrintRows}
    </div>

    ${state.removalPicks.length ? `
    <div class="doc-section">
      <div class="doc-section-title">Cutting Out / Reducing</div>
      ${state.removalPicks.map(item => `<div class="doc-habit-row"><div class="doc-habit-name">${escapeHtml(item)}</div><div class="doc-habit-detail">${escapeHtml(state.removalWhy[item]||'')}</div></div>`).join('')}
    </div>
    ` : ''}

    ${state.isMember ? `
    <div class="doc-section">
      <div class="doc-section-title">Act Like a FUTURE — 4 Weeks</div>
      <div class="doc-habit-row"><div class="doc-habit-name">${resetRangeText}</div><div class="doc-habit-detail">${state.resetItems.filter(r=>r.trim()).map(escapeHtml).join(' · ')}</div></div>
    </div>
    ` : ''}

    ${trackerPagesHtml}
  `;

  const fill = document.getElementById('progressFill');
  if (fill) fill.style.width = '100%';
  pushGeorgeCard(`<div class="card" style="background:transparent; border:none; padding:0;">${html}</div>`, () => {
    document.getElementById('inputArea').innerHTML = `
      <div class="result-actions">
        <button class="pdf-btn" onclick="window.print()">⬇ Save as PDF</button>
        <div class="subscribe-box">
          <p>Want a weekly email you can count on to help you stick with this? We'll send one practical nudge a week to help you keep your practice.</p>
          <div class="subscribe-row">
            <input type="text" id="subEmail" placeholder="you@example.com">
            <button class="send" onclick="submitSubscribe()">Subscribe</button>
          </div>
          <div class="subscribe-status" id="subStatus"></div>
        </div>
        <div class="continue-row" style="justify-content:center;">
          <button class="send ghost" onclick="restart()">Start Over</button>
        </div>
      </div>
    `;
  });
}

async function submitSubscribe() {
  const input = document.getElementById('subEmail');
  const status = document.getElementById('subStatus');
  const email = input.value.trim();
  if (!email || !email.includes('@')) { status.textContent = 'Enter a valid email.'; return; }
  status.textContent = 'Subscribing…';
  try {
    const res = await fetch('/api/subscribe', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email })
    });
    if (res.ok) {
      status.textContent = "You're in — first email soon.";
      input.disabled = true;
    } else {
      status.textContent = 'Something went wrong. Try again in a bit.';
    }
  } catch (e) {
    status.textContent = 'Something went wrong. Try again in a bit.';
  }
}

function restart() {
  clearSavedDraft();
  state.transcript = [];
  state.customAreas = [];
  state.fRatings = {};
  state.fHowSo = {};
  state.isMember = null;
  state.roundCount = "";
  state.returningAfterGap = false;
  state.gapPicks = [];
  state.practices = {};
  state.nonNegotiables = DEFAULT_NN.map(x => ({...x}));
  state.resetItems = ["No alcohol", "No processed food", "No refined sugar"];
  state.resetDateStr = "";
  state.timing = {};
  state.customRemovals = [];
  state.removalPicks = [];
  state.removalWhy = {};
  state.dismissedFlags = {};
  state.triedBefore = {};
  state.resumePoint = null;
  state.pending = null;
  state.stepNum = 0;
  state.history = [];
  renderTranscript();
  clearInputArea();
  startFlow();
}

// showResult is the finish line — once someone has their declaration, the
// draft is done serving its purpose. Clearing it here (rather than only on
// explicit restart) means closing the tab after finishing doesn't leave a
// stale "welcome back" prompt waiting on their next visit.
const _showResult = showResult;
showResult = function() { clearSavedDraft(); _showResult(); };

startWithResumeCheck();
</script>
</body>
</html>
