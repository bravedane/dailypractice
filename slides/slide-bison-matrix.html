:root {
  --black: #0c0c0c;
  --gold: #ffd627;
  --gold-dim: rgba(255, 214, 39, 0.78);
  --white: #fafafa;
  --white-dim: rgba(250, 250, 250, 0.72);
  --grey: #55544c;
  --grey-dim: #39382f;
  --line-grey: #3a3a36;
  --line-white: #e8e8e4;

  --storms: #7fa8d4;
  --storms-dim: rgba(127, 168, 212, 0.76);
  --drift: #c3b587;
  --drift-dim: rgba(195, 181, 135, 0.76);
  --addiction: #d4714f;
  --addiction-dim: rgba(212, 113, 79, 0.76);
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  width: 100%;
  height: 100%;
  background: var(--black);
  overflow: hidden;
  font-family: "Aeonik", sans-serif;
}

.stage {
  position: fixed;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  user-select: none;
  padding: 2vh 2vw;
}

/* ---------- Title ---------- */
.title {
  position: absolute;
  top: 4vh;
  left: 4.5vw;
  font-family: "Schabo Condensed", sans-serif;
  font-size: clamp(22px, 3.1vw, 54px);
  letter-spacing: 0.03em;
  text-transform: uppercase;
  text-align: left;
  color: var(--gold);
  opacity: 0;
  transition: opacity 0.7s ease, color 0.7s ease;
}
.title.is-shown { opacity: 1; }
.title.is-muted { color: var(--grey); }
.title.is-active { color: var(--gold); }

/* ---------- Matrix frame ---------- */
.matrix-wrap {
  position: relative;
  width: min(66vw, 70vh);
  height: min(66vw, 70vh);
  transform: translateY(-5vh);
}

.matrix {
  position: relative;
  width: 100%;
  height: 100%;
  display: grid;
  grid-template-columns: 1fr 1fr;
  grid-template-rows: 1fr 1fr;
}

/* axis lines */
.axis-line {
  position: absolute;
  background: var(--line-white);
  opacity: 0;
  transition: opacity 0.7s ease, background-color 0.7s ease;
}
.axis-x-line {
  left: 0; right: 0; top: 50%;
  height: 2px;
  transform: translateY(-50%);
}
.axis-y-line {
  top: 0; bottom: 0; left: 50%;
  width: 2px;
  transform: translateX(-50%);
}
.axis-line.is-shown { opacity: 1; }
.axis-line.is-active { background-color: var(--line-white); }
.axis-line.is-muted { background-color: var(--line-grey); }

/* axis labels */
.axis-label {
  position: absolute;
  font-family: "Aeonik", sans-serif;
  font-weight: 700;
  font-size: clamp(13px, 1.3vw, 22px);
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--white);
  white-space: nowrap;
  opacity: 0;
  transition: opacity 0.7s ease, color 0.7s ease;
}
.axis-label.is-shown { opacity: 1; }
.axis-label.is-active { color: var(--white); }
.axis-label.is-muted { color: var(--grey); }

.axis-label-left {
  top: 50%; right: calc(100% + 1.6em);
  transform: translateY(-50%);
  text-align: right;
}
.axis-label-right {
  top: 50%; left: calc(100% + 1.6em);
  transform: translateY(-50%);
}
.axis-label-top {
  left: 50%; bottom: calc(100% + 1em);
  transform: translateX(-50%);
}
.axis-label-bottom {
  left: 50%; top: calc(100% + 1em);
  transform: translateX(-50%);
}

/* quadrants */
.quadrant {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  gap: 0.6em;
  padding: 3vmin 2.5vmin;
}
.q-storms    { grid-column: 1; grid-row: 1; }
.q-agency    { grid-column: 2; grid-row: 1; }
.q-drift     { grid-column: 1; grid-row: 2; }
.q-addiction { grid-column: 2; grid-row: 2; }

.q-label {
  font-family: "Aeonik", sans-serif;
  font-weight: 700;
  font-size: clamp(20px, 2.5vw, 44px);
  letter-spacing: 0.04em;
  text-transform: uppercase;
  opacity: 0;
  transition: opacity 0.7s ease, color 0.7s ease;
}
.q-desc {
  font-family: "Aeonik", sans-serif;
  font-weight: 400;
  font-size: clamp(13px, 1.25vw, 20px);
  line-height: 1.35;
  max-width: 85%;
  opacity: 0;
  transition: opacity 0.7s ease, color 0.7s ease;
}
.quadrant.is-shown .q-label,
.quadrant.is-shown .q-desc { opacity: 1; }

.quadrant.is-active .q-label { color: var(--white); }
.quadrant.is-active .q-desc  { color: var(--white-dim); }
.quadrant.is-muted .q-label  { color: var(--grey); }
.quadrant.is-muted .q-desc   { color: var(--grey-dim); }

.q-agency.is-active .q-label { color: var(--gold); }
.q-agency.is-active .q-desc  { color: var(--gold-dim); }

.q-storms.is-active .q-label    { color: var(--storms); }
.q-storms.is-active .q-desc     { color: var(--storms-dim); }
.q-drift.is-active .q-label     { color: var(--drift); }
.q-drift.is-active .q-desc      { color: var(--drift-dim); }
.q-addiction.is-active .q-label { color: var(--addiction); }
.q-addiction.is-active .q-desc  { color: var(--addiction-dim); }

/* progress + hint */
.chrome {
  position: fixed;
  bottom: 2.2vh;
  right: 2.4vw;
  font-family: "Aeonik", sans-serif;
  font-size: 13px;
  letter-spacing: 0.08em;
  color: #4a4a46;
  opacity: 0.65;
  text-transform: uppercase;
}
.chrome .hint { margin-left: 1.2em; }
</style>
</head>
<body>
  <div class="stage" id="stage">

    <div class="title" data-group="title">THE BISON MATRIX</div>

    <div class="matrix-wrap">
      <div class="matrix">

        <div class="axis-line axis-x-line" data-group="axis-x"></div>
        <div class="axis-line axis-y-line" data-group="axis-y"></div>

        <div class="axis-label axis-label-left"  data-group="axis-x">Involuntary</div>
        <div class="axis-label axis-label-right" data-group="axis-x">Voluntary</div>
        <div class="axis-label axis-label-top"    data-group="axis-y">Discomfort</div>
        <div class="axis-label axis-label-bottom" data-group="axis-y">Comfort</div>

        <div class="quadrant q-storms" data-group="storms">
          <div class="q-label">Storms</div>
          <div class="q-desc">Hardship I didn&rsquo;t choose.</div>
        </div>

        <div class="quadrant q-agency" data-group="agency">
          <div class="q-label">Agency</div>
          <div class="q-desc">Choosing the hard thing on purpose.</div>
        </div>

        <div class="quadrant q-drift" data-group="drift">
          <div class="q-label">The Drift</div>
          <div class="q-desc">Currents that take me places I don&rsquo;t want to go.</div>
        </div>

        <div class="quadrant q-addiction" data-group="addiction">
          <div class="q-label">Addiction</div>
          <div class="q-desc">Choosing cheap, short-term comfort until it chooses me.</div>
        </div>

      </div>
    </div>

  </div>

  <div class="chrome">
    <span id="progress">1 / 7</span>
    <span class="hint" id="hint">click or &rarr; to continue</span>
  </div>

<script>
(function () {
  var STEPS = ['title', 'axis-x', 'storms', 'drift', 'axis-y', 'addiction', 'agency'];
  var current = 0;
  var progressEl = document.getElementById('progress');
  var hintEl = document.getElementById('hint');

  function render() {
    STEPS.forEach(function (key, idx) {
      var els = document.querySelectorAll('[data-group="' + key + '"]');
      var shown = idx <= current;
      var active = idx === current;

      els.forEach(function (el) {
        el.classList.toggle('is-shown', shown);
        el.classList.toggle('is-active', shown && active);
        el.classList.toggle('is-muted', shown && !active);
      });
    });

    progressEl.textContent = (current + 1) + ' / ' + STEPS.length;
    hintEl.style.opacity = current === STEPS.length - 1 ? '0' : '1';
  }

  function next() {
    if (current < STEPS.length - 1) { current++; render(); }
  }
  function prev() {
    if (current > 0) { current--; render(); }
  }

  document.addEventListener('keydown', function (e) {
    if (['ArrowRight', 'ArrowDown', 'PageDown', ' '].indexOf(e.key) !== -1) {
      e.preventDefault(); next();
    } else if (['ArrowLeft', 'ArrowUp', 'PageUp'].indexOf(e.key) !== -1) {
      e.preventDefault(); prev();
    }
  });
  document.getElementById('stage').addEventListener('click', next);

  render();
})();
</script>
</body>
</html>
