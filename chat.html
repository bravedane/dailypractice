<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your Daily Practice</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  @font-face {
    font-family: 'Schabo Condensed';
    src: url('assets/SCHABO-Condensed.woff2') format('woff2');
    font-weight: 400;
    font-style: normal;
  }
  :root {
    --bg: #0c0c0c;
    --surface: #171717;
    --surface-2: #1d1d1d;
    --border: #2a2a2a;
    --gold: #ffd627;
    --text: #f7f7f7;
    --muted: #9a9a9a;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    background-image: radial-gradient(circle at 15% -10%, rgba(255, 214, 39, 0.07), transparent 45%);
    color: var(--text);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  .app {
    max-width: 600px;
    margin: 0 auto;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  .header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 16px 16px 12px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .header img { height: 18px; opacity: 0.92; }
  .header .divider { width: 1px; height: 14px; background: var(--border); }
  .header .tagline {
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .bubble a { color: var(--gold); text-decoration: underline; }
  .row.user .bubble a { color: #171717; }
  .header-right {
    margin-left: auto;
    font-size: 11px;
    color: var(--muted);
    white-space: nowrap;
  }
  .progress-track {
    height: 3px;
    background: var(--border);
    flex-shrink: 0;
  }
  .progress-fill {
    height: 100%;
    background: var(--gold);
    transition: width 0.3s ease;
    width: 0%;
  }
  .scroll {
    flex: 1;
    overflow-y: auto;
    padding: 20px 16px 12px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  /* Push short conversations to the bottom with a margin on the first
     bubble rather than justify-content:flex-end on the scroll container.
     flex-end + overflow-y:auto is a known browser bug: once content is
     taller than the viewport, the overflowing top portion becomes
     unreachable by scrolling. margin-top:auto gets the same "stick to
     bottom when short" look without breaking scroll once content grows
     (e.g. the long results screen). */
  .scroll > *:first-child { margin-top: auto; }
  .row { display: flex; }
  .row.george { justify-content: flex-start; }
  .row.user { justify-content: flex-end; }
  .avatar {
    width: 26px; height: 26px;
    border-radius: 50%;
    background: var(--surface);
    border: 1px solid var(--gold);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    margin-right: 8px;
    margin-top: 2px;
  }
  .avatar img { width: 13px; height: auto; opacity: 0.95; }
  .bubble {
    max-width: 78%;
    padding: 11px 14px;
    border-radius: 14px;
    font-size: 14.5px;
    line-height: 1.5;
  }
  .bubble .hl { color: var(--gold); font-weight: 600; }
  .row.george .bubble {
    background: var(--surface);
    border: 1px solid var(--border);
    border-top-left-radius: 4px;
  }
  .row.user .bubble {
    background: var(--gold);
    color: #171717;
    font-weight: 500;
    border-top-right-radius: 4px;
  }
  .typing-dots {
    display: flex;
    gap: 4px;
    padding: 4px 2px;
  }
  .typing-dots span {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--muted);
    animation: bounce 1.2s infinite;
  }
  .typing-dots span:nth-child(2) { animation-delay: 0.15s; }
  .typing-dots span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
    30% { transform: translateY(-4px); opacity: 1; }
  }
  .card {
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px;
  }
  .card + .card { margin-top: 8px; }
  .input-area {
    border-top: 1px solid var(--border);
    padding: 14px 16px 16px;
    flex-shrink: 0;
    background: var(--bg);
    box-shadow: 0 -8px 16px -8px rgba(0,0,0,0.4);
  }
  .chip-row {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .chip {
    background: rgba(255, 214, 39, 0.1);
    border: 1.5px solid var(--gold);
    color: var(--gold);
    border-radius: 20px;
    padding: 10px 18px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.12s, transform 0.08s;
  }
  .chip:hover { background: rgba(255, 214, 39, 0.22); }
  .chip:active { transform: scale(0.97); }
  .chip.sel {
    background: var(--gold);
    color: #171717;
    border-color: var(--gold);
    font-weight: 700;
  }
  .text-row {
    display: flex;
    gap: 8px;
  }
  .text-row input[type=text], .text-row input[type=time] {
    flex: 1;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 22px;
    color: var(--text);
    padding: 11px 16px;
    font-size: 14.5px;
  }
  .text-row input:focus { outline: none; border-color: var(--gold); }
  button.send {
    background: var(--gold);
    color: #171717;
    border: none;
    border-radius: 22px;
    padding: 13px 22px;
    min-height: 46px;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    cursor: pointer;
  }
  button.send:disabled { opacity: 0.35; cursor: not-allowed; }
  button.send.ghost {
    background: transparent;
    color: var(--muted);
    border: 1px solid var(--border);
  }
  .continue-row {
    display: flex;
    justify-content: flex-end;
    margin-top: 10px;
  }
  /* Continue is the primary action on every card screen — make it a full
     width, easy-to-reach target instead of a small pill in the corner. */
  .continue-row .send { width: 100%; }
  .back-link {
    background: none;
    border: none;
    color: var(--muted);
    font-size: 12.5px;
    cursor: pointer;
    padding: 0;
    margin-bottom: 10px;
    display: block;
  }
  .back-link:hover { color: var(--text); }
  .field-label {
    display: block;
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 5px;
  }
  .nn-row, .reset-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 7px 0;
    border-bottom: 1px solid var(--border);
  }
  .nn-row:last-child, .reset-row:last-child { border-bottom: none; }
  .card input[type=text] {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    padding: 8px 10px;
    font-size: 13px;
    margin-bottom: 8px;
  }
  .nn-toggle { display: flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; flex-shrink: 0; }
  .nn-toggle button { background: transparent; border: none; color: var(--muted); font-size: 11px; padding: 6px 10px; cursor: pointer; }
  .nn-toggle button.sel-in { background: var(--gold); color: #171717; font-weight: 700; }
  .nn-toggle button.sel-out { background: #3a1f1f; color: #ff8080; font-weight: 700; }
  .remove-x { background: none; border: none; color: #6b6b6b; cursor: pointer; font-size: 15px; padding: 0 4px; flex-shrink: 0; }
  .add-row { display: flex; gap: 6px; margin-top: 4px; }
  .add-row input { margin-bottom: 0 !important; flex: 1; }
  .add-row button { background: transparent; border: 1px solid var(--border); color: var(--gold); border-radius: 8px; padding: 0 12px; font-size: 12px; font-weight: 700; cursor: pointer; }
  select.date-sel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    padding: 10px 6px;
    font-size: 13px;
  }
  .directive {
    background: rgba(255, 214, 39, 0.1);
    border: 1px solid var(--gold);
    border-radius: 10px;
    padding: 10px 13px;
    font-size: 13px;
    line-height: 1.5;
  }
  .result-block { margin-bottom: 10px; }
  .result-block.highlight {
    border: 1px solid var(--gold);
    background: rgba(255, 214, 39, 0.08);
    border-radius: 10px;
    padding: 10px 12px;
  }
  .result-label {
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--gold);
    margin-bottom: 4px;
  }
  .result-value { font-size: 14px; line-height: 1.4; }
  .progress-hint {
    font-size: 11px;
    color: var(--muted);
    text-align: center;
    margin-bottom: 2px;
  }
  .result-actions {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-top: 6px;
  }
  button.pdf-btn {
    background: transparent;
    border: 1px solid var(--gold);
    color: var(--gold);
    border-radius: 22px;
    padding: 11px 18px;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    cursor: pointer;
  }
  button.pdf-btn:hover { background: rgba(255, 214, 39, 0.1); }
  .subscribe-box {
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px;
    margin-top: 4px;
  }
  .subscribe-box p {
    font-size: 13px;
    color: var(--muted);
    margin: 0 0 10px 0;
    line-height: 1.5;
  }
  .subscribe-row { display: flex; gap: 8px; }
  .subscribe-row input {
    flex: 1;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    color: var(--text);
    padding: 10px 14px;
    font-size: 13.5px;
  }
  .subscribe-row input:focus { outline: none; border-color: var(--gold); }
  .subscribe-status {
    font-size: 12px;
    color: var(--gold);
    margin-top: 8px;
  }
  @media print {
    @page { margin: 0.5in; }
    body { background: #fdfaf3 !important; background-image: none !important; color: #1a1a1a !important; }
    .header, .progress-track, .scroll, .input-area, .no-print { display: none !important; }
    .app { height: auto !important; max-width: none !important; }
    #printArea { display: block !important; }
  }
  #printArea { display: none; }
  #printArea {
    --ink: #1a1a1a;
    --ink-muted: #6b5f4a;
    --paper: #fdfaf3;
    --line: #d8cdb3;
    --accent: #a8860c;
    font-family: 'Inter', sans-serif;
    color: var(--ink);
    max-width: 680px;
    margin: 0 auto;
  }
  .doc-header {
    text-align: center;
    border-bottom: 3px double var(--accent);
    padding-bottom: 16px;
    margin-bottom: 22px;
  }
  .doc-eyebrow {
    font-size: 11px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 6px;
  }
  .doc-title {
    font-family: 'Schabo Condensed', sans-serif;
    font-size: 34px;
    text-transform: uppercase;
    letter-spacing: 0.02em;
    margin: 0;
  }
  .doc-sub {
    font-size: 12px;
    color: var(--ink-muted);
    margin-top: 6px;
  }
  .doc-section {
    margin-bottom: 20px;
    break-inside: avoid;
  }
  .doc-section-title {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    color: var(--accent);
    border-bottom: 1px solid var(--line);
    padding-bottom: 4px;
    margin-bottom: 10px;
  }
  .doc-habit-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding: 6px 0;
    border-bottom: 1px dotted var(--line);
    font-size: 13.5px;
    gap: 12px;
  }
  .doc-habit-row:last-child { border-bottom: none; }
  .doc-habit-name { font-weight: 600; flex-shrink: 0; }
  .doc-habit-detail { color: var(--ink-muted); font-size: 12.5px; text-align: right; }
  .doc-nn-list { list-style: none; padding: 0; margin: 0; columns: 2; column-gap: 24px; }
  .doc-nn-list li { font-size: 13px; padding: 4px 0; break-inside: avoid; }
  .doc-tracker {
    border-collapse: collapse;
    width: 100%;
    font-size: 9.5px;
    margin-top: 6px;
  }
  .doc-tracker th, .doc-tracker td {
    border: 1px solid var(--line);
    text-align: center;
    padding: 3px 1px;
  }
  .doc-tracker th.week-label, .doc-tracker td.habit-label {
    text-align: left;
    padding-left: 6px;
    font-size: 10.5px;
    font-weight: 600;
    white-space: nowrap;
  }
  .doc-tracker td.check-cell { width: 20px; height: 20px; }
  .doc-tracker-page {
    break-before: page;
    padding-top: 8px;
  }
  .doc-tracker-page:first-of-type { break-before: auto; }
  .doc-month-line {
    display: flex;
    gap: 24px;
    margin-bottom: 14px;
    font-size: 13px;
  }
  .doc-month-line .fill {
    display: inline-block;
    min-width: 140px;
    border-bottom: 1px solid var(--ink);
    margin-left: 6px;
  }
  .doc-footer {
    margin-top: 24px;
    padding-top: 12px;
    border-top: 1px solid var(--line);
    text-align: center;
    font-size: 10.5px;
    color: var(--ink-muted);
    letter-spacing: 0.05em;
  }
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <img src="assets/mwod-logo-white.svg" alt="MWOD">
    <div class="divider"></div>
    <div class="tagline">Your Daily Practice</div>
    <div class="header-right" id="progressLabel">Progress</div>
  </div>
  <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
  <div class="scroll" id="scroll"></div>
  <div class="input-area" id="inputArea"></div>
  <div id="printArea"></div>
</div>

<script>
const CORE_AREAS = ["Fitness","Food","Sleep","Hydration","Family","Friends","Faith","Work","Frenemies","Money","Projects","Relationships","Phone"];
const RATING_LABELS = {
  "Fitness": ["Absent","Inconsistent","Strong"],
  "Food": ["Careless","Inconsistent","Clean"],
  "Sleep": ["Wrecked","Inconsistent","Rested"],
  "Hydration": ["Neglected","Inconsistent","Dialed In"],
  "Family": ["Distant","Inconsistent","Present"],
  "Friends": ["Isolated","Inconsistent","Connected"],
  "Faith": ["Dormant","Inconsistent","Grounded"],
  "Work": ["Behind","Treading Water","On Top Of It"],
  "Frenemies": ["Overexposed","Managing","Protected"],
  "Money": ["Avoiding It","Inconsistent","Disciplined"],
  "Projects": ["Stalled","Inconsistent","Shipping Consistently"],
  "Relationships": ["Disconnected","Misaligned","Known and Loved"],
  "Phone": ["Out Of Control","Some Control","Disciplined"]
};
function ratingLabelsFor(key) { return RATING_LABELS[key] || ["Absent","Inconsistent","Strong"]; }
const AREA_CLARIFIERS = {
  "Family": "however you define it — parents, spouse, kids, siblings, whoever counts",
  "Faith": "religious practice, spiritual life, alignment with your conscience, or whatever you personally ground yourself in",
  "Relationships": "romantic partner, if that's separate from Family for you",
  "Frenemies": "people who complicate more than they add",
  "Projects": "personal projects, not your job — Work covers that"
};
function areaClarifier(key) { return AREA_CLARIFIERS[key] || null; }
const AREA_QUESTION_OVERRIDES = {
  "Phone": "Let's talk about your **Phone Use**"
};
function areaQuestionIntro(key) { return AREA_QUESTION_OVERRIDES[key] || `Let's talk about **${key}**`; }
function areaFollowUpPrompt(key, rating, ratingLabel) {
  return `You said ${key} has been **${ratingLabel.toLowerCase()}**. Will you share a bit more about why that is? The more specific you are, the better this ends up serving you.`;
}
const DEFAULT_NN = [
  { text: "Sleep — 7+ hrs average per week, no phone in bed", status: "in" },
  { text: "Hydration — 90+ oz of water every day", status: "in" },
  { text: "Nutrition — eat clean: meat, vegetables, nuts, seeds, some fruit; avoid processed food and added sugar", status: "in" },
  { text: "Movement — 1+ hr workout, 6 days a week", status: "in" },
  { text: "Check-ins — check in with your community 6 days a week", status: "in" }
];
const MONTH_NAMES = ["January","February","March","April","May","June","July","August","September","October","November","December"];

const state = {
  transcript: [],
  customAreas: [],
  fRatings: {},
  fHowSo: {},
  isMember: null,
  roundCount: "",
  returningAfterGap: false,
  gapPicks: [],
  practices: {},
  timing: {},
  customRemovals: [],
  removalPicks: [],
  removalWhy: {},
  nonNegotiables: DEFAULT_NN.map(x => ({...x})),
  resetItems: ["No alcohol", "No processed food", "No refined sugar"],
  resetMonth: "", resetDay: "", resetYear: "",
  pending: null,
  qCount: 0,
  stepNum: 0,
  history: []
};

// --- Back navigation -------------------------------------------------
function snapshotState() {
  const { transcript, history, pending, ...rest } = state;
  return JSON.parse(JSON.stringify(rest));
}
function restoreSnapshot(snap) {
  Object.keys(snap).forEach(k => { state[k] = snap[k]; });
}
function recordHistoryStep(text, pending) {
  state.history.push({ text, pending, snapshot: snapshotState(), transcriptLen: state.transcript.length });
}
function backButtonHtml() {
  if (state.history.length < 2) return '';
  return `<button class="back-link" onclick="goBack()">← Back</button><br>`;
}
function goBack() {
  if (state.history.length < 2) return;
  state.history.pop();
  const prev = state.history.pop();
  restoreSnapshot(prev.snapshot);
  state.transcript = state.transcript.slice(0, prev.transcriptLen);
  renderTranscript();
  let pending = prev.pending;
  if (pending.type === 'multichips') pending = { ...pending, selected: [] };
  recordHistoryStep(prev.text, pending);
  document.getElementById('inputArea').innerHTML = '';
  pushGeorge(prev.text, () => {
    state.pending = pending;
    renderInputArea();
  });
}

// Rough total question count for the progress bar. Recomputed as choices
// (custom areas, gap picks) become known so it stays honest rather than
// just decorative.
function computeStepTotal() {
  const areaCount = allAreaKeys().length;
  const gapCount = state.gapPicks.length || 2; // estimate before chosen
  const resetSteps = state.isMember ? 2 : 0; // reset list + reset date, members only
  return 1                    // round count
       + areaCount            // one quick rating tap per area (no separate why)
       + 1                    // add-another-area prompt
       + 1                    // non-negotiables
       + (state.isMember ? 1 : 0) // returning-after-gap, members only
       + 1                    // gap picks
       + gapCount              // why, asked only for picked areas
       + gapCount              // one card per practice (was 1 already)
       + gapCount              // one combined timing card per habit (was 4 steps)
       + resetSteps;
}
function updateProgressBar() {
  const total = computeStepTotal();
  const pct = Math.min(96, Math.round((state.stepNum / total) * 100));
  const fill = document.getElementById('progressFill');
  if (fill) fill.style.width = pct + '%';
}
let uidCounter = 0;

function allAreaKeys() { return [...CORE_AREAS, ...state.customAreas]; }
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function formatGeorgeText(text) {
  let out = escapeHtml(text);
  out = out.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  out = out.replace(/\*\*(.+?)\*\*/g, '<span class="hl">$1</span>');
  return out;
}

function scrollBottom() {
  const el = document.getElementById('scroll');
  el.scrollTop = el.scrollHeight;
  // Input controls (chips/cards) render after the transcript and can
  // change the layout height slightly after this frame — nudge again
  // once the browser has painted so the last message stays in view.
  requestAnimationFrame(() => { el.scrollTop = el.scrollHeight; });
}

function renderTranscript() {
  const el = document.getElementById('scroll');
  el.innerHTML = state.transcript.map(t => {
    if (t.typing) {
      return `<div class="row george"><div class="avatar"><img src="assets/mwod-logo-white.svg" alt="MWOD"></div><div class="bubble"><div class="typing-dots"><span></span><span></span><span></span></div></div></div>`;
    }
    if (t.who === 'george') {
      return `<div class="row george"><div class="avatar"><img src="assets/mwod-logo-white.svg" alt="MWOD"></div><div class="bubble">${t.html}</div></div>`;
    }
    return `<div class="row user"><div class="bubble">${t.html}</div></div>`;
  }).join('');
  scrollBottom();
}

function pushGeorge(text, after) {
  const id = 'g' + (++uidCounter);
  state.transcript.push({ who: 'george', typing: true, id });
  renderTranscript();
  setTimeout(() => {
    const entry = state.transcript.find(x => x.id === id);
    entry.typing = false;
    entry.html = formatGeorgeText(text);
    renderTranscript();
    if (after) after();
  }, 550);
}

function pushGeorgeCard(html, after) {
  const id = 'g' + (++uidCounter);
  state.transcript.push({ who: 'george', typing: true, id });
  renderTranscript();
  setTimeout(() => {
    const entry = state.transcript.find(x => x.id === id);
    entry.typing = false;
    entry.html = html;
    renderTranscript();
    if (after) after();
  }, 550);
}

function pushUser(text) {
  state.transcript.push({ who: 'user', html: escapeHtml(text) });
  renderTranscript();
}

function clearInputArea() {
  document.getElementById('inputArea').innerHTML = '';
}

function askQuestion(text, pending) {
  document.getElementById('inputArea').innerHTML = '';
  if (pending.type === 'multichips') pending.selected = pending.selected || [];
  recordHistoryStep(text, pending);
  state.stepNum++;
  updateProgressBar();
  pushGeorge(text, () => {
    state.pending = pending;
    renderInputArea();
  });
}

function submitPending(value, displayLabel) {
  const label = displayLabel !== undefined ? displayLabel : String(value);
  pushUser(label);
  const p = state.pending;
  state.pending = null;
  clearInputArea();
  p.onSubmit(value, label);
}

function renderInputArea() {
  const p = state.pending;
  const el = document.getElementById('inputArea');
  if (!p) { el.innerHTML = ''; return; }
  scrollBottom();
  const back = backButtonHtml();

  if (p.type === 'chips') {
    el.innerHTML = `${back}<div class="chip-row">${p.options.map((o, idx) =>
      `<button class="chip" data-idx="${idx}" onclick="handleChipClick(this)">${escapeHtml(o.label)}</button>`
    ).join('')}</div>`;
    return;
  }

  if (p.type === 'multichips') {
    const sel = p.selected;
    el.innerHTML = `
      ${back}
      <div class="chip-row" id="mcRow">${p.options.map((o, idx) => {
        const isSel = sel.includes(o.value);
        return `<button class="chip ${isSel?'sel':''}" data-idx="${idx}" onclick="handleMultiChipClick(this)">${escapeHtml(o.label)}</button>`;
      }).join('')}</div>
      <div class="continue-row">
        <button class="send" id="mcContinue" onclick="submitMultiChip()" ${sel.length<1?'disabled':''}>Continue</button>
      </div>
    `;
    return;
  }

  if (p.type === 'text' || p.type === 'text-optional') {
    const optional = p.type === 'text-optional';
    el.innerHTML = `
      ${back}
      <div class="text-row">
        <input type="text" id="textInput" placeholder="${p.placeholder||''}" autocomplete="off" onkeydown="if(event.key==='Enter') submitTextInput()">
        <button class="send" onclick="submitTextInput()">${optional?'Send':'Send'}</button>
      </div>
    `;
    setTimeout(() => { const i = document.getElementById('textInput'); if (i) i.focus(); }, 50);
    return;
  }

  if (p.type === 'time') {
    el.innerHTML = `
      ${back}
      <div class="text-row">
        <input type="time" id="timeInput">
        <button class="send" onclick="submitTimeInput()">Send</button>
      </div>
    `;
    return;
  }

  if (p.type === 'nn-card') { renderNNCard(); return; }
  if (p.type === 'practice-card') { renderPracticeCard(p.key); return; }
  if (p.type === 'timing-card') { renderTimingCard(p.key); return; }
  if (p.type === 'reset-card') { renderResetCard(); return; }
  if (p.type === 'date3') { renderDate3(); return; }
}

function handleChipClick(btn) {
  const p = state.pending;
  const idx = Number(btn.getAttribute('data-idx'));
  const o = p.options[idx];
  submitPending(o.value, o.label);
}
function handleMultiChipClick(btn) {
  const p = state.pending;
  const idx = Number(btn.getAttribute('data-idx'));
  const o = p.options[idx];
  const selIdx = p.selected.indexOf(o.value);
  if (selIdx >= 0) p.selected.splice(selIdx, 1);
  else if (p.selected.length < (p.max || 5)) p.selected.push(o.value);
  renderInputArea();
}
function submitMultiChip() {
  const p = state.pending;
  if (p.selected.length < 1) return;
  submitPending(p.selected.slice(), p.selected.join(', '));
}
function submitTextInput() {
  const i = document.getElementById('textInput');
  const val = i.value.trim();
  submitPending(val, val || '(skipped)');
}
function submitTimeInput() {
  const i = document.getElementById('timeInput');
  if (!i.value) return;
  submitPending(i.value, i.value);
}

// ===== FLOW =====
function startFlow() {
  state.stepNum = 0;
  updateProgressBar();
  pushGeorge("Hey — let's build your daily practice. It takes about 5 minutes, and I'll ask one question at a time. You can track your progress in the bar at the top. At the end, you'll get a clear one-page declaration you can save as a PDF and keep.", () => {
    setTimeout(askIsMember, 500);
  });
}

function askIsMember() {
  askQuestion("Quick one first — are you an MWOD member?", {
    type: 'chips',
    options: [{label: "Yes, I'm a member", value: true}, {label: "No / not sure", value: false}],
    onSubmit: (val) => {
      state.isMember = val;
      if (val) { askRoundCount(); }
      else { explainMwodThenContinue(); }
    }
  });
}

function explainMwodThenContinue() {
  pushGeorge("No worries — this works for anyone. MWOD (Men and Women of Discomfort) is a community built around daily practice and voluntary discomfort. You can learn more at [mwod.io](https://mwod.io) or apply to join at [mwod.io/apply](https://mwod.io/apply).", () => {
    setTimeout(askNonNegotiables, 400);
  });
}

function askRoundCount() {
  askQuestion("How many rounds have you completed? Totally fine to skip if you're not sure.", {
    type: 'text-optional', placeholder: 'e.g. 6',
    onSubmit: (val) => { state.roundCount = val === '(skipped)' ? '' : val; askNonNegotiables(); }
  });
}

function labelForRating(key, rating) {
  const [lo, mid, hi] = ratingLabelsFor(key);
  return rating === 'strong' ? hi : rating === 'inconsistent' ? mid : lo;
}
function askArea(idx) {
  const keys = allAreaKeys();
  if (idx >= keys.length) { askAddAnotherArea(); return; }
  const key = keys[idx];
  const [lo, mid, hi] = ratingLabelsFor(key);
  const clarifier = areaClarifier(key);
  const clarifierLine = clarifier ? ` (${clarifier})` : '';
  askQuestion(`${areaQuestionIntro(key)}${clarifierLine}. How's that actually been going for you lately?`, {
    type: 'chips',
    options: [{label: lo, value: 'absent'}, {label: mid, value: 'inconsistent'}, {label: hi, value: 'strong'}],
    onSubmit: (val, label) => { state.fRatings[key] = val; askArea(idx + 1); }
  });
}
function askAddAnotherArea() {
  askQuestion("Want to track anything else, outside that list?", {
    type: 'chips',
    options: [{label: '+ Add another', value: 'add'}, {label: "I'm done", value: 'done'}],
    onSubmit: (val) => {
      if (val === 'add') askCustomAreaName();
      else askRemovalsIntro();
    }
  });
}

// --- Anything to remove (subtraction goals: alcohol, substances, gambling,
// toxic relationships, etc.) — a separate question shape from the areas
// above, because quitting/reducing something isn't a habit to build, it's
// a boundary to declare. Kept optional and low-pressure. ---
const REMOVAL_SUGGESTIONS = ["Alcohol", "Drugs / Substances", "Gambling", "A Toxic Relationship", "Screen / Media Bingeing"];
function askRemovalsIntro() {
  askQuestion("Is there anything you're actively trying to cut out or reduce right now? Alcohol, gambling, a toxic relationship — whatever it is.", {
    type: 'chips',
    options: [{label: 'Yes', value: true}, {label: 'No, not right now', value: false}],
    onSubmit: (val) => {
      if (val) askRemovalsPick();
      else if (state.isMember) askReturningGap();
      else askGapPicks();
    }
  });
}
function askRemovalsPick() {
  const options = [...REMOVAL_SUGGESTIONS, ...state.customRemovals].map(r => ({label: r, value: r}));
  askQuestion("Pick what applies — or add your own if it's not listed.", {
    type: 'multichips', selected: [], min: 1, max: 8,
    options,
    onSubmit: (vals) => { state.removalPicks = vals; askAddCustomRemoval(); }
  });
}
function askAddCustomRemoval() {
  askQuestion("Anything else to add to that list? Type it, or say no to move on.", {
    type: 'text-optional', placeholder: 'e.g. a specific habit only you would name',
    onSubmit: (val) => {
      if (val && val !== '(skipped)' && val.trim()) {
        const item = val.trim();
        state.customRemovals.push(item);
        state.removalPicks.push(item);
      }
      askRemovalWhy(0);
    }
  });
}
function askRemovalWhy(idx) {
  if (idx >= state.removalPicks.length) {
    if (state.isMember) askReturningGap(); else askGapPicks();
    return;
  }
  const item = state.removalPicks[idx];
  askQuestion(`What's going on with **${item}**? The more specific you are, the better this ends up serving you.`, {
    type: 'text-optional', placeholder: 'One sentence is plenty',
    onSubmit: (val) => {
      state.removalWhy[item] = (val && val !== '(skipped)') ? val : '';
      askRemovalWhy(idx + 1);
    }
  });
}

function askCustomAreaName() {
  askQuestion("What should we call it?", {
    type: 'text', placeholder: 'e.g. Creativity, Rest, Screen Time',
    onSubmit: (val) => {
      if (val && val.trim() && !allAreaKeys().includes(val.trim())) {
        state.customAreas.push(val.trim());
        askArea(allAreaKeys().length - 1);
      } else if (state.isMember) {
        askReturningGap();
      } else {
        askGapPicks();
      }
    }
  });
}
function askReturningGap() {
  askQuestion("Coming back after taking some time off?", {
    type: 'chips',
    options: [{label: 'Yes', value: true}, {label: 'No', value: false}],
    onSubmit: (val) => { state.returningAfterGap = val; askGapPicks(); }
  });
}
function tenureNudge() {
  if (state.returningAfterGap === true) {
    return "You're coming back after time away — that resets the clock, regardless of how many times you've done this before. Lean toward 1–2. Rebuild the streak before you rebuild the list.";
  }
  const n = parseInt(state.roundCount, 10);
  if (isNaN(n)) return null;
  if (n <= 1) return "You're new to this. Lean toward picking just 1 — maybe 2. Consistency beats a long list right now.";
  if (n <= 3) return "You've done this a few times. 1–2 is still a solid move — no need to max it out to prove something.";
  return null;
}
function askGapPicks() {
  const nudge = tenureNudge();
  const proceed = () => {
    const keys = allAreaKeys();
    const flagged = keys.filter(k => state.fRatings[k] === 'inconsistent' || state.fRatings[k] === 'absent');
    const list = flagged.length ? flagged : keys.filter(k => state.fRatings[k]);
    askQuestion("Which of these do you want to build a specific daily habit around this time? Choose at least 1, up to 5 max — we'll build the actual practice for each one next.", {
      type: 'multichips', selected: [], min: 1, max: 5,
      options: list.map(k => ({label: k, value: k})),
      onSubmit: (vals) => { state.gapPicks = vals; askWhyForArea(0); }
    });
  };
  if (nudge) { pushGeorge(nudge, () => setTimeout(proceed, 450)); }
  else { proceed(); }
}
function askNonNegotiables() {
  askQuestion("At MWOD, we recommend the following 5 Baseline Habits be part of everyone's practice. Once you've got these committed, we'll help you consider other opportunities to add to your practice in this season of your life.", {
    type: 'nn-card',
    onSubmit: () => { askArea(0); }
  });
}
function askWhyForArea(idx) {
  if (idx >= state.gapPicks.length) { askTimingForArea(0); return; }
  const key = state.gapPicks[idx];
  const rating = state.fRatings[key];
  const ratingLabel = labelForRating(key, rating);
  askQuestion(areaFollowUpPrompt(key, rating, ratingLabel), {
    type: 'text-optional', placeholder: 'One sentence is plenty',
    onSubmit: (val) => {
      const hadContent = val !== '(skipped)' && val.trim().length > 0;
      state.fHowSo[key] = hadContent ? val : '';
      askPracticeForArea(idx);
    }
  });
}
function askPracticeForArea(idx) {
  if (idx >= state.gapPicks.length) { askTimingForArea(0); return; }
  const key = state.gapPicks[idx];
  askQuestion(`Let's build the daily habit for **${key}**. Each one needs a little friction in it — not something you're already coasting on.`, {
    type: 'practice-card', key,
    onSubmit: () => { askWhyForArea(idx + 1); }
  });
}
function askTimingForArea(idx) {
  if (idx >= state.gapPicks.length) {
    if (state.isMember) askReset(); else showResult();
    return;
  }
  const key = state.gapPicks[idx];
  askQuestion(`Now the timing for **${key}** — when it happens, and your backup plan if the day gets knocked off track.`, {
    type: 'timing-card', key,
    onSubmit: () => { askTimingForArea(idx + 1); }
  });
}
function askReset() {
  askQuestion("Last question (this one's for just for MWOD members): For your Act Like A FUTURE (ALAF) Weeks, your job is to commit to 4 consecutive weeks when you'll be on the hook to act like a future. Choose what that means for you below. The dates are coming next.", {
    type: 'reset-card',
    onSubmit: () => { askResetDate(); }
  });
}
function askResetDate() {
  askQuestion("When do those 4 weeks start?", {
    type: 'date3',
    onSubmit: (resetDate) => { state.resetDateStr = resetDate; showResult(); }
  });
}

function showResult() {
  const baselineKeys = allAreaKeys().filter(k => state.fRatings[k]);
  // Look Back is the quick, across-the-board snapshot rating for every area —
  // it deliberately does NOT repeat the "why" note, because that note only
  // exists for areas that were also chosen as Course Correction picks, and
  // showing it in both places produced identical duplicated text for any
  // overlapping area. The deep-dive note belongs to Course Correction only.
  const baselineDetails = baselineKeys.map(k => {
    const rating = state.fRatings[k];
    return `<strong>${escapeHtml(k)}</strong> (${rating})`;
  }).join("<br>");
  const gapDetails = state.gapPicks.map(k => {
    const rating = state.fRatings[k];
    const note = state.fHowSo[k] ? ` — ${escapeHtml(state.fHowSo[k])}` : "";
    return `${escapeHtml(k)}: ${rating}${note}`;
  }).join("<br>");
  let resetRangeText = "—";
  if (state.resetDateStr) {
    const start = new Date(state.resetDateStr + "T00:00:00");
    const end = addDays(state.resetDateStr, 27);
    resetRangeText = `${formatDate(start)} → ${formatDate(end)}`;
  }
  const nnIn = state.nonNegotiables.filter(nn => nn.status === "in");
  const nnOut = state.nonNegotiables.filter(nn => nn.status === "out");

  const html = `
    <div style="margin-bottom:8px; font-size:12px; text-transform:uppercase; letter-spacing:0.06em; color:var(--gold);">Your Daily Practice — Locked In</div>
    <div style="font-family:'Schabo Condensed', sans-serif; font-size:19px; text-transform:uppercase; margin-bottom:10px;">Here's what you just committed to.</div>
    <div style="font-size:13px; color:var(--muted); margin-bottom:14px;">Your full declaration is ready — tap Save as PDF below for a printable version with a trackable chart.</div>
    <div class="result-block highlight"><div class="result-label">Baseline Recommendation</div><div class="result-value" style="font-size:13px;">
      ${nnIn.map(nn => `✓ ${escapeHtml(nn.text)}`).join("<br>")}
      ${nnOut.length ? `<br><span style="color:var(--muted);">Out: ${nnOut.map(nn=>escapeHtml(nn.text)).join(', ')}</span>` : ''}
    </div></div>
    <div class="result-block"><div class="result-label">Look Back</div><div class="result-value" style="font-size:13px;">${baselineDetails}</div></div>
    <div class="result-block"><div class="result-label">Course Correction</div><div class="result-value">${gapDetails}</div></div>
    ${state.gapPicks.map(k => {
      const p = state.practices[k] || { practice: "", doneDefinition: "", amount: "" };
      const t = state.timing[k] || {};
      return `<div class="result-block"><div class="result-label">Practice — ${escapeHtml(k)}</div><div class="result-value">${escapeHtml(p.practice)}</div><div class="result-value" style="margin-top:4px; font-size:12px; color:var(--muted);">Done when: ${escapeHtml(p.doneDefinition)} — ${escapeHtml(p.amount)}</div><div class="result-value" style="margin-top:4px; font-size:12px; color:var(--muted);">When: ${t.time || "—"} · ${escapeHtml(t.anchor||'')} — Backup: ${t.backupTime || "—"} · ${escapeHtml(t.backupAnchor||'')}</div></div>`;
    }).join("")}
    ${state.removalPicks.length ? `<div class="result-block"><div class="result-label">Cutting Out / Reducing</div><div class="result-value" style="font-size:13px;">${state.removalPicks.map(item => `${escapeHtml(item)}${state.removalWhy[item] ? ' — ' + escapeHtml(state.removalWhy[item]) : ''}`).join('<br>')}</div></div>` : ''}
    ${state.isMember ? `<div class="result-block"><div class="result-label">Act Like a FUTURE — 4 Weeks</div><div class="result-value">${resetRangeText}</div><div class="result-value" style="margin-top:4px; font-size:12px; color:var(--muted);">${state.resetItems.filter(r=>r.trim()).map(escapeHtml).join(' · ')}</div></div>` : ''}
  `;

  // --- Print / PDF version: a wall-worthy one-page declaration + an
  // analog-style 28-day tracker grid (habits down the side, days across,
  // hand-checked box per day). Built separately from the chat-bubble html
  // above — different audience (paper, not screen), different design needs.
  const trackerHabits = [
    ...nnIn.map(nn => nn.text.split(' — ')[0]),
    ...state.gapPicks
  ];
  const dayNums = Array.from({length: 31}, (_, i) => i + 1);
  const trackerHeader = dayNums.map(d => `<th>${d}</th>`).join('');
  function buildTrackerRows() {
    return trackerHabits.map(h => `
      <tr>
        <td class="habit-label">${escapeHtml(h)}</td>
        ${dayNums.map(() => `<td class="check-cell"></td>`).join('')}
      </tr>
    `).join('');
  }
  const trackerPagesHtml = [1, 2, 3].map(pageNum => `
    <div class="doc-section doc-tracker-page">
      <div class="doc-section-title">31-Day Tracker — Month ${pageNum} — Check Off Each Day, By Hand</div>
      <div class="doc-month-line">Month:<span class="fill"></span>Year:<span class="fill"></span></div>
      <table class="doc-tracker">
        <thead><tr><th class="week-label">Habit</th>${trackerHeader}</tr></thead>
        <tbody>${buildTrackerRows()}</tbody>
      </table>
    </div>
  `).join('');

  const nnPrintList = state.nonNegotiables.map(nn =>
    `<li>${nn.status === 'in' ? '☑' : '☐'} ${escapeHtml(nn.text)}</li>`
  ).join('');

  const practicePrintRows = state.gapPicks.map(k => {
    const p = state.practices[k] || {};
    const t = state.timing[k] || {};
    return `
      <div class="doc-habit-row">
        <div>
          <div class="doc-habit-name">${escapeHtml(k)}</div>
          <div style="font-size:12px; color:var(--ink-muted); margin-top:2px;">${escapeHtml(p.practice||'')}</div>
          <div style="font-size:11px; color:var(--ink-muted); margin-top:2px;">Done when: ${escapeHtml(p.doneDefinition||'')} — ${escapeHtml(p.amount||'')}</div>
        </div>
        <div class="doc-habit-detail">
          ${t.time || '—'}<br>${escapeHtml(t.anchor||'')}
          <div style="margin-top:4px; font-size:11px;">Backup: ${t.backupTime||'—'} · ${escapeHtml(t.backupAnchor||'')}</div>
        </div>
      </div>
    `;
  }).join('');

  const lookBackPrintRows = baselineKeys.map(k => {
    const rating = state.fRatings[k];
    const label = labelForRating(k, rating);
    const note = state.fHowSo[k] ? escapeHtml(state.fHowSo[k]) : '';
    return `<div class="doc-habit-row"><div class="doc-habit-name">${escapeHtml(k)}</div><div class="doc-habit-detail">${escapeHtml(label)}${note ? ' — ' + note : ''}</div></div>`;
  }).join('');

  document.getElementById('printArea').innerHTML = `
    <div class="doc-header">
      <div class="doc-eyebrow">MWOD · Men and Women of Discomfort</div>
      <h1 class="doc-title">Your Daily Practice</h1>
      <div class="doc-sub">A declaration, made ${new Date().toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' })}</div>
    </div>

    <div class="doc-section">
      <div class="doc-section-title">Baseline Recommendation</div>
      <ul class="doc-nn-list">${nnPrintList}</ul>
    </div>

    <div class="doc-section">
      <div class="doc-section-title">Look Back</div>
      ${lookBackPrintRows}
    </div>

    <div class="doc-section">
      <div class="doc-section-title">Your Practices — What, When, Backup</div>
      ${practicePrintRows}
    </div>

    ${state.removalPicks.length ? `
    <div class="doc-section">
      <div class="doc-section-title">Cutting Out / Reducing</div>
      ${state.removalPicks.map(item => `<div class="doc-habit-row"><div class="doc-habit-name">${escapeHtml(item)}</div><div class="doc-habit-detail">${escapeHtml(state.removalWhy[item]||'')}</div></div>`).join('')}
    </div>
    ` : ''}

    ${state.isMember ? `
    <div class="doc-section">
      <div class="doc-section-title">Act Like a FUTURE — 4 Weeks</div>
      <div class="doc-habit-row"><div class="doc-habit-name">${resetRangeText}</div><div class="doc-habit-detail">${state.resetItems.filter(r=>r.trim()).map(escapeHtml).join(' · ')}</div></div>
    </div>
    ` : ''}

    ${trackerPagesHtml}

    <div class="doc-footer">UP UNTIL NOW, FROM NOW ON.</div>
  `;

  const fill = document.getElementById('progressFill');
  if (fill) fill.style.width = '100%';
  pushGeorgeCard(`<div class="card" style="background:transparent; border:none; padding:0;">${html}</div>`, () => {
    document.getElementById('inputArea').innerHTML = `
      <div class="result-actions">
        <button class="pdf-btn" onclick="window.print()">⬇ Save as PDF</button>
        <div class="subscribe-box">
          <p>Want a weekly email you can count on to help you stick with this? We'll send one practical nudge a week to help you keep your practice.</p>
          <div class="subscribe-row">
            <input type="text" id="subEmail" placeholder="you@example.com">
            <button class="send" onclick="submitSubscribe()">Subscribe</button>
          </div>
          <div class="subscribe-status" id="subStatus"></div>
        </div>
        <div class="continue-row" style="justify-content:center;">
          <button class="send ghost" onclick="restart()">Start Over</button>
        </div>
      </div>
    `;
  });
}

async function submitSubscribe() {
  const input = document.getElementById('subEmail');
  const status = document.getElementById('subStatus');
  const email = input.value.trim();
  if (!email || !email.includes('@')) { status.textContent = 'Enter a valid email.'; return; }
  status.textContent = 'Subscribing…';
  try {
    const res = await fetch('/api/subscribe', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email })
    });
    if (res.ok) {
      status.textContent = "You're in — first email soon.";
      input.disabled = true;
    } else {
      status.textContent = 'Something went wrong. Try again in a bit.';
    }
  } catch (e) {
    status.textContent = 'Something went wrong. Try again in a bit.';
  }
}

function restart() {
  state.transcript = [];
  state.customAreas = [];
  state.fRatings = {};
  state.fHowSo = {};
  state.isMember = null;
  state.roundCount = "";
  state.returningAfterGap = false;
  state.gapPicks = [];
  state.practices = {};
  state.nonNegotiables = DEFAULT_NN.map(x => ({...x}));
  state.resetItems = ["No alcohol", "No processed food", "No refined sugar"];
  state.resetMonth = ""; state.resetDay = ""; state.resetYear = ""; state.resetDateStr = "";
  state.timing = {};
  state.customRemovals = [];
  state.removalPicks = [];
  state.removalWhy = {};
  state.pending = null;
  state.stepNum = 0;
  state.history = [];
  renderTranscript();
  clearInputArea();
  startFlow();
}

startFlow();
</script>
</body>
</html>
