<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MWOD — What Do You Want?</title>
<link rel="stylesheet" href="fonts.css">
<style>
  :root {
    --gold: #ffd627;
    --black: #0c0c0c;
    --white: #fafafa;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100vw;
    height: 100vh;
    background: var(--black);
    overflow: hidden;
  }
  .slide {
    position: relative;
    width: 100vw;
    height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 4vw;
  }

  .headline {
    position: relative;
    z-index: 2;
    font-family: "Aeonik", sans-serif;
    font-weight: 700;
    font-size: clamp(28px, 3.6vw, 72px);
    line-height: 1;
    letter-spacing: 0.02em;
    color: var(--white);
    text-transform: uppercase;
    text-align: center;
  }

  .want {
    position: relative;
    z-index: 2;
    font-family: "Schabo Condensed", sans-serif;
    font-weight: 400;
    font-size: clamp(180px, 34vw, 720px);
    line-height: 0.82;
    letter-spacing: -0.01em;
    color: var(--gold);
    text-transform: uppercase;
    text-align: center;
    white-space: nowrap;
  }

</style>
</head>
<body>
  <div class="slide">
    <div class="headline">What do you</div>
    <div class="want">WANT?</div>
  </div>
</body>
</html>
